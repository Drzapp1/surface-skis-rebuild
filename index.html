<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Surface Skis — an unofficial design prototype. W27.">
  <meta name="theme-color" content="#171714">
  <title>Surface Skis / W27</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e8ed42'/%3E%3Ctext x='8' y='31' font-family='Arial' font-size='32' font-weight='900'%3Es%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=pages-2">
  <script src="app.js?v=pages-2" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="header">
    <a class="logo" href="#/" aria-label="Surface Skis home">surface<span>®</span></a>
    <nav aria-label="Main navigation">
      <a href="#/shop" data-page="shop">Skis</a>
      <a href="#/compare" data-page="compare">Compare</a>
      <a href="#/team" data-page="team">Team</a>
      <a href="#/videos" data-page="videos">Videos</a>
      <a href="#/faq" data-page="faq">Info</a>
    </nav>
  </header>
  <main id="content" tabindex="-1"></main>
  <footer class="footer"><span>Unofficial concept</span><a href="#/">Surface ↗</a></footer>
  <template id="home-template">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">SURFACE<span class="sr-only"> Skis</span></h1>
      <div class="hero__field">
        <figure class="hero__photo">
          <img src="assets/img/site/hero.jpg" alt="Surface riders and skis on a chairlift" fetchpriority="high" width="1600" height="1067">
        </figure>
        <div class="hero__season" aria-label="Winter 27">W<span>27</span></div>
        <svg class="orbit" viewBox="0 0 300 300" fill="none" aria-hidden="true">
          <ellipse cx="150" cy="150" rx="133" ry="53" transform="rotate(-42 150 150)"/>
          <ellipse cx="150" cy="150" rx="133" ry="53" transform="rotate(32 150 150)"/>
          <ellipse cx="150" cy="150" rx="133" ry="53" transform="rotate(85 150 150)"/>
          <path d="m133 122 38 0-38 57h38M148 106l-4 13m20 64-4 13" stroke-width="9"/>
        </svg>
        <a class="hero__link" href="#/shop">Skis <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </template>
  <template id="team-template">
    <section class="team section route-page" id="team" aria-labelledby="team-title">
      <div class="section-head"><h1 id="team-title">TEAM</h1>
        <svg class="asterisk" viewBox="0 0 100 100" aria-hidden="true"><path d="m50 1 5 35L80 9 66 41l33-4-31 17 27 22-35-10-2 33-12-31-25 25 11-34L1 58l33-13L11 21l33 15Z"/></svg>
      </div>
      <div class="team-grid">
        <figure class="rider"><img src="assets/img/riders/harald-hellstr-m.jpg" alt="Harald Hellström" width="600" height="800" loading="lazy"><figcaption>Harald<br>Hellström</figcaption></figure>
        <figure class="rider"><img src="assets/img/riders/mainio-ormio.jpg" alt="Mainio Ormio" width="600" height="800" loading="lazy"><figcaption>Mainio<br>Ormio</figcaption></figure>
        <figure class="rider"><img src="assets/img/riders/tereza-kor-bov.jpg" alt="Tereza Korábová" width="600" height="800" loading="lazy"><figcaption>Tereza<br>Korábová</figcaption></figure>
      </div>
    </section>
  </template>
  <template id="videos-template">
    <div class="videos-page route-page">
      <div class="section-head video-heading"><h1>VIDEOS</h1></div>
    <section class="film film--page" id="film" aria-label="Surface at Woodward film">
      <a href="https://www.youtube.com/watch?v=5Q-HpqfP8ug" target="_blank" rel="noopener noreferrer" aria-label="Watch Surface at Woodward on YouTube (opens in a new tab)">
        <img src="assets/img/videos/5Q-HpqfP8ug.jpg" alt="Surface at Woodward film still" loading="lazy" width="1280" height="720">
        <span class="film__title">WOODWARD<span>↗</span></span>
        <span class="film__play" aria-hidden="true">▶</span>
      </a>
    </section>
    </div>
  </template>
  <template id="faq-template">
    <section class="info section route-page" id="info" aria-labelledby="info-title">
      <h1 id="info-title">INFO<span aria-hidden="true">↙</span></h1>
      <div class="info__body">
        <p>Surface makes skis for park, street and all-mountain skiing.</p>
        <a class="text-link" href="https://www.surfaceskis.com/" target="_blank" rel="noopener noreferrer">surfaceskis.com <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
      </div>
    </section>
  </template>
  <noscript><p class="section">Enable JavaScript to view the prototype.</p></noscript>
</body>
</html>
